<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f3">
<meta name="description" content="觸控認字、逐字發音、依序拼句的練習工具">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="認字拼句">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>認字拼句練習｜模式一</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#213042;background:#f7f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #186cce;outline-offset:3px}.app{max-width:1100px;margin:auto;padding:clamp(14px,3vw,30px) 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h1{font-size:clamp(22px,3vw,30px);margin:0}.sub{color:#586474;font-size:15px;margin:7px 0 0}.panel{background:#fff;border-radius:23px;padding:clamp(16px,3vw,27px);margin-top:18px;box-shadow:0 1px 8px #20304012}.section-title{margin:0 0 15px;font-size:19px;font-weight:750}.prompt{font-size:clamp(27px,5vw,43px);font-weight:800;letter-spacing:.03em;line-height:1.5;overflow-wrap:anywhere}.reference{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:8px;max-width:100%;overflow-x:auto;padding:3px 0}.pair{min-width:0;display:flex;flex-direction:column;gap:9px;text-align:center}.refchar{font-weight:800;font-size:clamp(22px,3.8vw,38px);line-height:1.4}.slot{height:clamp(56px,8vw,92px);background:#f2f6fd;border:3px dashed #b9c9dc;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:clamp(24px,4.3vw,43px);color:#173e73}.slot.filled{background:#e5f2ff;border:3px solid #73a8e2}.tilearea{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:95px}.tile{height:clamp(69px,11vw,102px);min-width:clamp(69px,11vw,102px);border:2px solid #cfdbeb;border-bottom-width:5px;border-radius:18px;background:#fff;font-size:clamp(32px,5vw,47px);font-weight:800;color:#172f48;box-shadow:0 3px 6px #19385217;transition:transform .08s}.tile:active{transform:scale(.94)}.tile.used{visibility:hidden;pointer-events:none}.actionrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.action{border:0;border-radius:14px;padding:14px 20px;min-height:54px;font-size:18px;font-weight:750;background:#eaf0f6;color:#203449}.action.primary{background:#1969bd;color:white}.action.warn{background:#f9ece9;color:#983b2e}.action:disabled{opacity:.35;cursor:default}.status{font-size:17px;color:#526074;margin:14px 0 0;min-height:24px}.settings{margin-top:18px}.settings summary{font-weight:700;font-size:17px;cursor:pointer;padding:8px 0}.editrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.editrow input{flex:1;min-width:200px;min-height:52px;border:2px solid #a9b9c7;border-radius:12px;padding:10px 14px;font-size:21px}.settingrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0}.settingrow label{font-weight:700}.settingrow input[type="range"]{width:min(340px,100%);flex:1;accent-color:#1969bd;min-height:40px}.speedval{min-width:60px;font-variant-numeric:tabular-nums;font-weight:750}.examplebtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.examplebtns button{border:2px solid #d1deec;background:#f4f8fc;border-radius:12px;padding:11px 14px;min-height:48px;font-weight:650}.help{color:#687482;font-size:14px;line-height:1.7;margin:10px 0 0}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:550px){.reference{gap:4px}.slot{border-width:2px!important;border-radius:9px;min-height:49px;height:clamp(49px,12vw,70px)}.pair{gap:5px}.tilearea{gap:9px}.action{flex:1;min-width:125px}.panel{border-radius:17px}.refchar{font-size:clamp(20px,5vw,32px)}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body><main class="app">
<header class="top"><div><h1>認字拼句練習</h1><p class="sub">模式一｜看題目、點單字、排句子</p></div><button id="speakTargetTop" class="action" aria-label="朗讀題目">🔊 聽題目</button></header>
<section class="panel" aria-labelledby="questionTitle"><h2 id="questionTitle" class="section-title">題目</h2><div id="prompt" class="prompt">我愛喝水</div></section>
<section class="panel" aria-labelledby="answerTitle"><h2 id="answerTitle" class="section-title">照著上面的字，填入下面的空格</h2><div id="reference" class="reference" role="group" aria-label="題目對照與填字格"></div><div id="status" class="status" role="status" aria-live="polite">已填入 0 個字</div><div class="actionrow"><button id="undo" class="action" disabled>↶ 取消上一字</button><button id="clear" class="action warn" disabled>清除全部</button><button id="speakSentence" class="action primary" disabled>🔊 朗讀拼好的句子</button></div></section>
<section class="panel" aria-labelledby="tilesTitle"><h2 id="tilesTitle" class="section-title">點下面的字（點一下就會發音）</h2><div id="tiles" class="tilearea" role="group" aria-label="可選擇的字卡"></div><div class="actionrow"><button id="reshuffle" class="action">⤨ 重新打亂字卡</button></div></section>
<section class="panel" aria-labelledby="examplesTitle"><h2 id="examplesTitle" class="section-title">選擇練習題目</h2><div class="examplebtns" id="examples"><button type="button" data-sentence="我愛喝水">我愛喝水</button><button type="button" data-sentence="我要吃飯">我要吃飯</button><button type="button" data-sentence="我想休息">我想休息</button><button type="button" data-sentence="今天天氣好">今天天氣好</button></div><p class="help">這些都是公開的通用範例，不包含孩子的姓名或其他個人資料。</p></section>
<details class="panel settings" open><summary>語音設定與自訂題目</summary><div class="settingrow"><label for="speed">朗讀速度</label><input id="speed" type="range" min="0.5" max="1.5" value="0.8" step="0.1" aria-label="朗讀速度"><output class="speedval" id="speedValue" for="speed">0.8 倍</output><button id="testSpeed" type="button" class="action">▶ 試聽</button></div><p class="help">往左較慢，往右較快。調整後，單字、題目與整句朗讀都會使用新的速度。</p><label for="sentenceInput">自訂練習文字</label><div class="editrow"><input id="sentenceInput" value="我愛喝水" maxlength="20" autocomplete="off" spellcheck="false"><button id="apply" class="action primary">套用新題目</button></div><div class="actionrow"><button id="resetLocal" class="action warn" type="button">清除本機自訂設定</button></div><p class="help">建議使用 3～10 個中文字，暫不使用標點。自訂句子與朗讀速度只儲存在目前瀏覽器或裝置內，不會傳送到 GitHub，也不會成為其他人的預設題目；若清除瀏覽器資料，設定也會消失。</p></details>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const el={prompt:$('prompt'),reference:$('reference'),tiles:$('tiles'),status:$('status'),undo:$('undo'),clear:$('clear'),speakSentence:$('speakSentence'),speakTargetTop:$('speakTargetTop'),reshuffle:$('reshuffle'),sentenceInput:$('sentenceInput'),apply:$('apply'),speed:$('speed'),speedValue:$('speedValue'),testSpeed:$('testSpeed'),resetLocal:$('resetLocal'),examples:$('examples')};
let chars=[],cards=[],chosen=[],voice=null;
const DEFAULT_SENTENCE='我愛喝水';
const STORAGE_SENTENCE='readingSentence.customSentence.v2';
const STORAGE_SPEED='readingSentence.speechRate.v2';
let speechRate=0.8;
function stored(key){try{return localStorage.getItem(key)}catch(e){return null}}
function save(key,value){try{localStorage.setItem(key,value)}catch(e){}}
function clearStored(){try{localStorage.removeItem(STORAGE_SENTENCE);localStorage.removeItem(STORAGE_SPEED)}catch(e){}}
function speak(text){if(!text)return;if(!('speechSynthesis' in window)){el.status.textContent='這個瀏覽器目前不支援語音朗讀';return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=speechRate;u.pitch=1;u.volume=1;if(voice)u.voice=voice;window.speechSynthesis.speak(u);}
function findVoice(){if(!('speechSynthesis' in window))return;const list=speechSynthesis.getVoices();voice=list.find(v=>v.lang.toLowerCase()==='zh-tw')||list.find(v=>v.lang.toLowerCase().startsWith('zh'))||null;}
if('speechSynthesis' in window){findVoice();speechSynthesis.addEventListener?.('voiceschanged',findVoice);}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function update(){el.reference.style.setProperty('--count',Math.min(chars.length,8));el.reference.replaceChildren();chars.forEach((c,i)=>{const pair=document.createElement('div');pair.className='pair';const ref=document.createElement('div');ref.className='refchar';ref.textContent=c;const slot=document.createElement('div');slot.className='slot'+(i<chosen.length?' filled':'');slot.textContent=i<chosen.length?chosen[i].char:'';slot.setAttribute('aria-label',`第${i+1}格，題目${c}，${i<chosen.length?'已填'+chosen[i].char:'空白'}`);pair.append(ref,slot);el.reference.append(pair);});el.tiles.replaceChildren();cards.forEach(card=>{const b=document.createElement('button');b.className='tile'+(chosen.some(x=>x.id===card.id)?' used':'');b.textContent=card.char;b.type='button';b.disabled=chosen.some(x=>x.id===card.id)||chosen.length>=chars.length;b.setAttribute('aria-label',`選擇「${card.char}」`);b.addEventListener('click',()=>{if(chosen.some(x=>x.id===card.id)||chosen.length>=chars.length)return;chosen.push(card);speak(card.char);update();});el.tiles.append(b);});el.undo.disabled=chosen.length===0;el.clear.disabled=chosen.length===0;el.speakSentence.disabled=chosen.length===0;el.status.textContent=`已填入 ${chosen.length}／${chars.length} 個字`+(chosen.length===chars.length?'，全部填完了！':'');}
function init(sentence,persist=false){const normalized=Array.from(sentence.replace(/[\s\p{P}\p{S}]/gu,'')).slice(0,20);if(!normalized.length){el.status.textContent='請輸入至少一個中文字';return;}chars=normalized;cards=shuffle(chars.map((char,id)=>({char,id})));chosen=[];el.prompt.textContent=chars.join('');el.sentenceInput.value=chars.join('');if(persist)save(STORAGE_SENTENCE,chars.join(''));update();}
el.undo.addEventListener('click',()=>{chosen.pop();update();});el.clear.addEventListener('click',()=>{chosen=[];update();});el.reshuffle.addEventListener('click',()=>{chosen=[];cards=shuffle(cards);update();});el.speakSentence.addEventListener('click',()=>speak(chosen.map(x=>x.char).join('')));el.speakTargetTop.addEventListener('click',()=>speak(chars.join('')));el.apply.addEventListener('click',()=>init(el.sentenceInput.value,true));
el.sentenceInput.addEventListener('keydown',e=>{if(e.key==='Enter')init(el.sentenceInput.value,true);});
el.examples.addEventListener('click',e=>{const btn=e.target.closest('button[data-sentence]');if(btn)init(btn.dataset.sentence,true);});
function setRate(rate,persist=false){speechRate=Math.min(1.5,Math.max(0.5,Number(rate)||0.8));el.speed.value=String(speechRate);el.speedValue.textContent=speechRate.toFixed(1)+' 倍';if(persist)save(STORAGE_SPEED,String(speechRate));}
el.speed.addEventListener('input',()=>setRate(el.speed.value,true));
el.testSpeed.addEventListener('click',()=>speak(chars.join('')));
el.resetLocal.addEventListener('click',()=>{clearStored();setRate(0.8);init(DEFAULT_SENTENCE);});
setRate(stored(STORAGE_SPEED)||0.8);
init(stored(STORAGE_SENTENCE)||DEFAULT_SENTENCE);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('離線功能未啟用', err));
  });
}
</script></body></html>
